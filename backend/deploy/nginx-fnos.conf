# ppCoffe · fnOS 前端 + 反向代理（nginx）
#
# 容器只对外暴露 80（宿主映射为 ${WEB_PORT:-8081}）。
#
# 路由设计：
#   /            → H5 静态产物
#   /api/        → api:8000（业务接口）
#
# ⚠️ S3 预签名直传 **不走这里**：
#    SigV4 把 canonical URI 算进签名，nginx 一旦改写路径（加 /s3/ 前缀）
#    就会导致 SignatureDoesNotMatch；而且 minio-py 的 presigned_put_object
#    只接受 host:port，**无法携带路径前缀**。
#    所以 MinIO S3 单独暴露一个端口（${MINIO_PORT:-19000}），
#    由 MINIO_PUBLIC_ENDPOINT 指向它，路径与 Host 原样透传。

# log_format 必须定义在 http 层级（conf.d/*.conf 被 include 进 http 块），
# 不能写在 server 块内，否则 nginx 启动报错：
#   "log_format" directive is not allowed here
log_format ppcoffe '$remote_addr - $status $request_time "$request" rid=$upstream_http_x_request_id';

# Docker 内置 DNS（127.0.0.11）。用变量 + 运行时解析，
# 避免 api 容器重建换 IP 后 nginx 仍指向旧地址。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 曲线点与图片可能较大
    client_max_body_size 25m;

    access_log /var/log/nginx/ppcoffe.access.log ppcoffe;

    # ------------------------------------------------------------------
    #  业务 API
    # ------------------------------------------------------------------
    location /api/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------------------------------------------
    #  H5 静态产物
    #
    #  Taro H5 默认使用 hash 路由（location.hash），路径不带在服务端，
    #  所以不需要 SPA fallback 的 rewrite 规则。
    # ------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的资源（Vite 产物）长缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
