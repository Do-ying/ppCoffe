# log_format 必须定义在 http 层级（conf.d/*.conf 被 include 进 http 块），
# 不能写在 server 块内，否则 nginx 启动报错：
#   "log_format" directive is not allowed here
log_format ppcoffe '$remote_addr - $status $request_time "$request" rid=$upstream_http_x_request_id';

# Docker 内置 DNS（127.0.0.11）。用变量 + 运行时解析，
# 避免 api 容器重建换 IP 后 nginx 仍指向旧地址。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 曲线点与图片可能较大
    client_max_body_size 25m;

    access_log /var/log/nginx/ppcoffe.access.log ppcoffe;

    # ------------------------------------------------------------------
    #  业务 API
    # ------------------------------------------------------------------
    location /api/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------------------------------------------
    #  MinIO S3 兼容 API（预签名直传）
    #
    #  为什么不直接暴露 9000 端口：
    #    1) 小程序「合法域名」要求标准端口（80/443），自定义端口过不了审；
    #    2) 少开一个公网端口 = 少一个攻击面；
    #    3) 后续接 HTTPS 时只需在 nginx 这一层加证书。
    #
    #  关键：路径**不能改写**，且 Host 头必须**原样透传**。
    #    SigV4 把 host 和 canonical URI 一起算进签名，
    #    任何改写都会导致 SignatureDoesNotMatch。
    #    MinIO 用 path-style 寻址（/{bucket}/{key}），正好与 nginx 透传一致。
    # ------------------------------------------------------------------
    location / {
        set $minio_s3 http://minio:9000;
        proxy_pass $minio_s3$request_uri;
        proxy_http_version 1.1;

        # 原样透传客户端 Host（$http_host 保留端口），与预签名时算入的 host 一致
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 直传大文件时不要在 nginx 侧缓冲，直接流给 MinIO
        proxy_request_buffering off;
        proxy_buffering off;

        client_max_body_size 25m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # MinIO 内部管理路径（分片上传、策略查询等）
    location /.minio.sys/ {
        set $minio_sys http://minio:9000;
        proxy_pass $minio_sys$request_uri;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 300s;
    }

    # 根路径给个提示（精确匹配，优先级高于上面的前缀匹配，不影响 S3 的 /{bucket}/{key}）
    location = / {
        default_type text/plain;
        return 200 "ppCoffe API is running.\nAPI:  /api/v1/health\nS3:   /{bucket}/{key}\n";
    }
}
