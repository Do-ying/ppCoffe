name: ppcoffe

# 一键起齐依赖栈：MySQL 8 + Redis 7 + MinIO + API
#
#   docker compose up -d
#   docker compose exec api python manage.py init-db && docker compose exec api python manage.py seed
#
# 生产环境建议把 MySQL / MinIO 数据目录挂到独立磁盘，并给 MinIO 配置 TLS 与对象锁。

services:
  mysql:
    image: mysql:8.4
    container_name: ppcoffe-mysql
    restart: unless-stopped
    # 目标机为 2C / 1.6GB，按小内存调优（容器内 MySQL 约占 250-350MB）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 注意：MySQL 8.4 已移除 default-authentication-plugin 选项
      # （caching_sha2_password 自 8.4 起为默认认证插件）
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=60
      - --max-allowed-packet=32M
      - --performance-schema=OFF
      - --table-open-cache=128
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ppcoffe}
      MYSQL_USER: ${MYSQL_USER:-ppcoffe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 512m
    networks: [ppcoffe]

  redis:
    image: redis:7-alpine
    container_name: ppcoffe-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [ppcoffe]

  minio:
    # 自建镜像：官方 minio/minio 拉不到（Docker Hub 第三方命名空间被封 + 开源版已归档），
    # 详见 minio/Dockerfile 内的说明。构建基于可正常拉取的 library/alpine。
    build:
      context: ./minio
      dockerfile: ${MINIO_DOCKERFILE:-Dockerfile}
    image: ppcoffe/minio:alpine-20250524
    container_name: ppcoffe-minio
    # MinIO 镜像在部分网络环境（Docker Hub 第三方命名空间不可达）下拉不下来，
    # 因此放在 profile 里按需启用：
    #     docker compose --profile minio up -d
    # 默认用 STORAGE_DRIVER=local（预签名直传协议一致，无需改动前端）
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"   # S3 API（预签名直传走这里，必须对前端可达）
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Web 控制台
    healthcheck:
      # Alpine 基础镜像只有 busybox wget，没有官方镜像里的 mc ready
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 256m
    networks: [ppcoffe]

  # 一次性任务：建桶 + 生命周期规则 + 创建应用专用受限账号
  minio-init:
    # 复用上面自建的镜像（其中已含 mc 客户端），避免再拉一个官方镜像
    image: ppcoffe/minio:alpine-20250524
    container_name: ppcoffe-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?请在 .env 中设置 MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?请在 .env 中设置 MINIO_APP_SECRET_KEY}
      MINIO_BUCKET_BREW: ${MINIO_BUCKET_BREW:-ppcoffe-brew}
      MINIO_BUCKET_ROAST: ${MINIO_BUCKET_ROAST:-ppcoffe-roast}
      MINIO_BUCKET_TEMP: ${MINIO_BUCKET_TEMP:-ppcoffe-tmp}
    entrypoint: ["sh", "/init/minio-init.sh"]
    volumes:
      - ./deploy:/init:ro
    profiles: ["minio"]
    restart: "no"
    networks: [ppcoffe]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: ppcoffe-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
        required: false
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:-${SECRET_KEY}}
      AUTH_MODE: ${AUTH_MODE:-wechat}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-ppcoffe}:${MYSQL_PASSWORD:-ppcoffe}@mysql:3306/${MYSQL_DATABASE:-ppcoffe}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      # 预签名专用端点：前端拿到 URL 后要直连这个地址，
      # 而 SigV4 签名把 Host 算进去了，所以签名端点必须与前端访问的地址一致，
      # 否则会 403 SignatureDoesNotMatch。留空则退回 MINIO_ENDPOINT。
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-}
      MINIO_BUCKET_BREW: ${MINIO_BUCKET_BREW:-ppcoffe-brew}
      MINIO_BUCKET_ROAST: ${MINIO_BUCKET_ROAST:-ppcoffe-roast}
      MINIO_BUCKET_TEMP: ${MINIO_BUCKET_TEMP:-ppcoffe-tmp}
      # local 驱动：对象写入容器内该目录（挂 named volume 持久化）
      LOCAL_STORAGE_ROOT: ${LOCAL_STORAGE_ROOT:-/app/var/uploads}
      # 2 核小机器：2 worker × 2 thread 足够，避免内存打满
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads-data:${LOCAL_STORAGE_ROOT:-/app/var/uploads}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    networks: [ppcoffe]

  # 反向代理：对外只暴露 80，API / MinIO 留在容器网络内
  # 后续接 HTTPS 只需在此层加证书与 443 监听
  nginx:
    image: nginx:1.27-alpine
    container_name: ppcoffe-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    mem_limit: 64m
    networks: [ppcoffe]

volumes:
  mysql-data:
  redis-data:
  minio-data:
  nginx-logs:
  uploads-data:

networks:
  ppcoffe:
    driver: bridge
